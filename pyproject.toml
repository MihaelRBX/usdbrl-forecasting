[project]
name = "tcc-cambio"
version = "0.1.0"
description = "Previsão da taxa de câmbio USD/BRL: ARMA-GARCH vs. LSTM, GRU e Spiking Neural Networks"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Mihael Rommel Barbosa Xavier" },
    { name = "Edson Fu" },
]

dependencies = [
    "pandas>=3.0",
    "requests>=2.32",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
# Instalados conforme cada etapa do cronograma for chegando.
econometria = ["statsmodels>=0.14", "arch>=7.0"]
redes = ["torch>=2.4", "snntorch>=0.9"]
dev = ["pytest>=8.0", "ruff>=0.6", "jupyter>=1.0", "matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
